<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Example</title>
  <style>
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #0073e6;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>

<button class="btn" onclick="newPopup('form.html')">Open Popup</button>

<script>
  function newPopup(url) {
    let popupWindow = window.open(
      url,
      'popUpWindow',
      'height=500,width=900,left=225,top=110,resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=no,status=no'
    );

    // bring popup to focus
    if (window.focus) {
      popupWindow.focus();
    }
  }
</script>

</body>
</html>
