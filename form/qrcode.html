<!-- Certificate container -->
<div id="certificateArea" class="certificate-container">
   <h2>Certificate of Completion</h2>
   <p>Certificate No: MAP/IT/1656</p>
   <p>Student: John Doe</p>
   <div id="qrcode"></div> <!-- QR code will be placed here -->
</div>

<!-- Include jQuery + QRCode.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
$(document).ready(function(){
    // Example certificate data
    var student = {
        id: "MAP/IT/1656",
        name: "John Doe"
    };

    // Generate QR code
    $("#qrcode").empty(); // clear if already generated
    new QRCode(document.getElementById("qrcode"), {
        text: JSON.stringify(student),
        width: 120,
        height: 120,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
});
</script>
